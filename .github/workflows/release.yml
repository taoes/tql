name: Release

# =============================================================================
# TQL - Tauri 2 多平台构建 & GitHub Release 自动发布
# =============================================================================
#
# 触发条件：
#   1. 推送 tag（如 v0.0.1, v1.2.3）→ 自动触发
#   2. 手动触发（workflow_dispatch）
#
# 构建产物：
#   - Windows: .msi 安装包, .exe 安装程序
#   - macOS:   .dmg 磁盘映像 (Intel + Apple Silicon 双架构)
#   - Linux:   .deb, .AppImage, .rpm
#
# 所有产物自动上传到对应的 GitHub Release 中。
# =============================================================================

on:
  push:
    tags:
      - 'v[0-9]+.*'          # 匹配 v0.0.1, v1.2.3, v2.0.0-beta.1 等
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write             # 创建 Release 需要写入权限

jobs:
  # ===========================================================================
  # 构建矩阵：跨平台并行编译
  # ===========================================================================
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # 强制 Actions 使用 Node.js 24 运行时
    strategy:
      fail-fast: false        # 一个平台失败不影响其他平台

      # ------------------------------------------------------------------
      # 构建矩阵定义
      # ------------------------------------------------------------------
      matrix:
        include:
          # --- Linux (x86_64) ---
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x86_64
            os: linux

          # --- macOS (Intel) ---
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS Intel
            os: macos

          # --- macOS (Apple Silicon) ---
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS Apple Silicon
            os: macos

          # --- Windows (x86_64) ---
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
            label: Windows x86_64
            os: windows

    steps:
      # ------------------------------------------------------------------
      # Step 1: 检出代码
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Step 2: 安装 pnpm（Tauri 配置中使用 pnpm 作为包管理器）
      # ------------------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      # ------------------------------------------------------------------
      # Step 3: 安装 Node.js
      # ------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # ------------------------------------------------------------------
      # Step 4: 安装 Rust 工具链
      # ------------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ------------------------------------------------------------------
      # Step 5: 安装 Linux 系统依赖
      # Tauri 2 需要 webkit2gtk-4.1；其他为 Rust crate 编译所需
      # ------------------------------------------------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      # ------------------------------------------------------------------
      # Step 6: 安装前端依赖
      # ------------------------------------------------------------------
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------------
      # Step 7: 使用 tauri-action 构建并发布到 Release
      # 该 Action 会：
      #   1. 调用 tauri build 编译各平台二进制文件
      #   2. 自动创建 GitHub Release（首个完成的 job）
      #   3. 将构建产物上传到 Release Assets
      # ------------------------------------------------------------------
      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TQL ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 TQL ${{ github.ref_name }}

            Text Query Language - 跨平台桌面客户端

            ### 📦 下载

            | 平台 | 格式 |
            |------|------|
            | **macOS** (Apple Silicon) | `.dmg` |
            | **macOS** (Intel) | `.dmg` |
            | **Linux** | `.deb` / `.AppImage` / `.rpm` |
            | **Windows** | `.msi` / `.exe` |

            ### 🔗 校验和
            构建产物附带 SHA256 校验和，下载后请验证文件完整性。

            ---
            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
